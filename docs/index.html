<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="브라우저에서 안전하게 접속하는 SSH 터미널">
  <title>Orbit SSH — Web Terminal</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="glow"></div>
  <main>
    <header><div class="brand"><span class="logo">›_</span><span>ORBIT <b>SSH</b></span></div><div class="secure"><i></i> END-TO-END SESSION</div></header>
    <section class="hero">
      <div class="intro"><p class="eyebrow">REMOTE ACCESS, REIMAGINED</p><h1>어디서든,<br><em>바로 연결하세요.</em></h1><p class="lead">별도의 프로그램 없이 브라우저에서 서버에 접속하세요.<br>인증 정보는 저장되지 않으며 세션 종료 즉시 폐기됩니다.</p></div>
      <form id="connect-form" class="panel">
        <div class="panel-head"><div><span class="step">01</span><h2>새 SSH 연결</h2></div><span id="status" class="status">대기 중</span></div>
        <label>SSH IP 또는 호스트<input id="host" name="host" required autocomplete="off" placeholder="192.168.0.10"></label>
        <div class="grid"><label>PORT<input id="port" name="port" required type="number" min="1" max="65535" value="22"></label><label>SSH ID<input id="username" name="username" required autocomplete="username" placeholder="ubuntu"></label></div>
        <label>SSH PASSWORD<input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••••••"></label>
        <div class="divider"><span>또는 개인 키로 인증</span></div>
        <label class="drop" for="key"><span class="upload">⇧</span><span><b id="key-name">SSH 인증서 / 개인 키 업로드</b><small>PEM, KEY 파일 · 최대 1MB</small></span><input id="key" type="file" accept=".pem,.key,.ppk,application/x-pem-file"></label>
        <details class="advanced"><summary>고급 설정</summary><label>SSH 중계 서버 주소<input id="gateway" name="gateway" type="url" autocomplete="url" placeholder="wss://ssh-relay.example.com/ssh"><small>GitHub Pages에서는 별도로 배포한 중계 서버 주소가 필요합니다.</small></label></details>
        <button type="submit"><span>터미널 연결</span><b>→</b></button>
        <p id="error" class="error" role="alert"></p>
      </form>
    </section>
    <section id="terminal-section" class="terminal-wrap" hidden>
      <div class="terminal-bar"><div><i></i><i></i><i></i></div><span id="session-title">SSH SESSION</span><button id="disconnect" type="button">연결 종료</button></div>
      <div id="terminal"></div>
    </section>
    <footer><span>© 2026 ORBIT SSH</span><span>NO CREDENTIALS STORED · ENCRYPTED SSH TRANSPORT</span></footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
  <script src="./app.js"></script>
</body>
</html>
